# Headless-сервис (clusterIP: None): DNS-имя `postgres` резолвится сразу
# в IP пода, а у пода StatefulSet появляется стабильное имя
# postgres-0.postgres.kube-demo.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
