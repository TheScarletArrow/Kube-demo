# Права приложения на Kubernetes API — ровно то, что нужно кнопкам в UI,
# и только внутри namespace kube-demo:
#   kubectl get pods / rs / deploy / events  -> get, list
#   kubectl delete pod <name>                -> pods: delete
#   kubectl patch pod --subresource resize   -> pods/resize: patch
#   kubectl scale deployment/kube-demo       -> deployments/scale: patch
#   kubectl rollout restart|undo             -> deployments: patch, update
#   kubectl create job --from=cronjob/...    -> cronjobs: get, jobs: create
#   kubectl drain (поды демки)               -> pods/eviction: create
#   kubectl get nodes / cordon               -> ClusterRole: nodes get, list, patch
#   kubectl patch svc kube-demo (blue/green) -> services: get, patch
# Проверить: kubectl auth can-i --list -n kube-demo --as=system:serviceaccount:kube-demo:kube-demo
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-demo
  labels:
    app: kube-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-demo
  labels:
    app: kube-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # kubectl drain: выселение через Eviction API (учитывает PodDisruptionBudget)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # kubectl patch pod --subresource resize (in-place resize)
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  # HPA (в том числе созданный KEDA) — показать в UI метрику и желаемые реплики
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  # resourceNames: управлять можно только своим Deployment'ом, а не любым в namespace.
  # update нужен для rollout undo (запись шаблона предыдущей ревизии).
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["kube-demo"]
    verbs: ["get", "patch", "update"]
  # Blue/green: смотреть green-версию и переключать selector основного Service
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kube-demo-green"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kube-demo"]
    verbs: ["get", "patch"]
  # CronJob бэкапа: смотреть и запускать вручную (kubectl create job --from=cronjob/...)
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["postgres-backup"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-demo
  labels:
    app: kube-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-demo
subjects:
  - kind: ServiceAccount
    name: kube-demo
    namespace: kube-demo
---
# Ноды — ресурс уровня кластера, поэтому ClusterRole: смотреть ноды (карта
# кластера в UI) и cordon/uncordon (patch spec.unschedulable).
# Это самое «широкое» право демки: не давайте такой ServiceAccount чужим.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-demo-nodes
  labels:
    app: kube-demo
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-demo-nodes
  labels:
    app: kube-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-demo-nodes
subjects:
  - kind: ServiceAccount
    name: kube-demo
    namespace: kube-demo
