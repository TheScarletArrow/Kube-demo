apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-demo
  labels:
    app: kube-demo
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: kube-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # поднимаем по одному новому поду...
      maxUnavailable: 0  # ...и не гасим старый, пока новый не стал Ready
  template:
    metadata:
      labels:
        app: kube-demo
    spec:
      # ServiceAccount с правами из rbac.yaml: приложение само умеет
      # scale / delete pod / rollout restart (кнопки в UI).
      serviceAccountName: kube-demo
      terminationGracePeriodSeconds: 30
      # Стараемся раскидать реплики по разным нодам.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kube-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # initContainer: основной контейнер не стартует, пока Postgres не начнёт
      # принимать соединения. Статус пода в это время — Init:0/1.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -t 2; do echo "waiting for postgres..."; sleep 2; done
          envFrom:
            - configMapRef:
                name: kube-demo
          env:
            # Без явного пользователя libpq ищет uid 10001 в /etc/passwd,
            # не находит, и pg_isready навсегда застревает на "no attempt".
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi

      containers:
        - name: app
          image: kube-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kube-demo
          env:
            # Downward API: Kubernetes сам рассказывает поду, кто он и где он.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Креды к базе — из Secret.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB

          # startupProbe: пока не прошла — liveness/readiness не проверяются.
          # Даёт приложению до 60 с на старт (миграции, прогрев).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # readiness: 503 -> под убирается из балансировки, но не перезапускается.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          # liveness: 3 провала подряд -> kubelet перезапускает контейнер.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
