apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-demo
  labels:
    app: kube-demo
spec:
  replicas: 3
  revisionHistoryLimit: 5
  # Если за 60 с rollout не продвинулся (новые поды не становятся Ready),
  # Deployment получает условие Progressing=False / ProgressDeadlineExceeded.
  # Откатывать Kubernetes сам не будет — это делает человек или CD.
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: kube-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # поднимаем по одному новому поду...
      maxUnavailable: 0  # ...и не гасим старый, пока новый не стал Ready
  template:
    metadata:
      labels:
        app: kube-demo
        postgres-access: "true" # NetworkPolicy пускает к базе только поды с этой меткой
      annotations:
        # Prometheus (k8s/extras/observability) находит поды по этим аннотациям.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # ServiceAccount с правами из rbac.yaml: приложение само умеет
      # scale / delete pod / rollout restart (кнопки в UI).
      serviceAccountName: kube-demo
      terminationGracePeriodSeconds: 30
      # Когда нода перестаёт отвечать, она получает taint unreachable/not-ready,
      # и поды с неё выселяются через tolerationSeconds. По умолчанию это 300 с —
      # для демо слишком долго, ставим 20 с.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      # Стараемся раскидать реплики по разным нодам.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kube-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      volumes:
        # Общий том приложения и sidecar'а: приложение пишет access-лог, sidecar читает.
        - name: logs
          emptyDir:
            sizeLimit: 64Mi

      initContainers:
        # Нативный sidecar (Kubernetes 1.29+): init-контейнер с restartPolicy: Always.
        # Стартует ДО приложения, работает всё время жизни пода и останавливается
        # ПОСЛЕ него — поэтому последние строки лога не теряются. READY пода: 2/2.
        #   kubectl -n kube-demo logs <pod> -c access-log -f
        - name: access-log
          image: busybox:1.37
          restartPolicy: Always
          command: ["sh", "-c", "touch /var/log/app/access.log && exec tail -n0 -F /var/log/app/access.log"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi

        # Обычный initContainer: приложение не стартует, пока Postgres не начнёт
        # принимать соединения. Статус пода в это время — Init:1/2.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -t 2; do echo "waiting for postgres..."; sleep 2; done
          envFrom:
            - configMapRef:
                name: kube-demo
          env:
            # Без явного пользователя libpq ищет uid 10001 в /etc/passwd,
            # не находит, и pg_isready навсегда застревает на "no attempt".
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi

      containers:
        - name: app
          image: kube-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kube-demo
          env:
            # Сломанный релиз для демо: аннотация шаблона -> env (Downward API).
            # Поды с RELEASE_STATE=broken-* никогда не проходят readiness.
            - name: RELEASE_STATE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['kube-demo/release']
            - name: ACCESS_LOG
              value: /var/log/app/access.log
            # Downward API: Kubernetes сам рассказывает поду, кто он и где он.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Креды к базе — из Secret.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB

          # startupProbe: пока не прошла — liveness/readiness не проверяются.
          # Даёт приложению до 60 с на старт (миграции, прогрев).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # readiness: 503 -> под убирается из балансировки, но не перезапускается.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          # liveness: 3 провала подряд -> kubelet перезапускает контейнер.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi # превышение -> OOMKilled (кнопка «OOM» в UI)
          # In-place resize (Kubernetes 1.33+): CPU меняется у живого контейнера
          # без рестарта, а смена памяти перезапускает только контейнер.
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
