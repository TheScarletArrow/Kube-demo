# NodePort: приложение доступно на порту 30080 любой ноды.
# Внутри кластера — просто http://kube-demo (или kube-demo.kube-demo.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: kube-demo
  labels:
    app: kube-demo
spec:
  type: NodePort
  selector:
    app: kube-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
