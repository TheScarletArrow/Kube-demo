# Canary-версия приложения: тот же образ, другой цвет и приветствие.
# Трафик на неё направляет HTTPRoute (httproute.yaml) — 20% запросов через Gateway.
# Обычный NodePort-сервис kube-demo (selector app=kube-demo) её не видит.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-demo-canary
  namespace: kube-demo
  labels:
    app: kube-demo-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-demo-canary
  template:
    metadata:
      labels:
        app: kube-demo-canary
        postgres-access: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kube-demo # управляет основным Deployment'ом, как и остальные поды
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: kube-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kube-demo
          env:
            - name: APP_COLOR
              value: darkorange
            - name: GREETING
              value: Привет из canary
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-demo-canary
  namespace: kube-demo
  labels:
    app: kube-demo-canary
spec:
  selector:
    app: kube-demo-canary
  ports:
    - name: http
      port: 80
      targetPort: http
