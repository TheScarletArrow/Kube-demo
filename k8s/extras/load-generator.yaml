# Генератор нагрузки для демо HPA: долбит /api/burn, который жжёт CPU.
#   kubectl apply -f k8s/extras/load-generator.yaml    # включить
#   kubectl delete -f k8s/extras/load-generator.yaml   # выключить
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: kube-demo
  labels:
    app: load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.37
          command:
            - sh
            - -c
            - while true; do wget -q -O /dev/null "http://kube-demo/api/burn?ms=100" || sleep 1; done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 16Mi
