# NetworkPolicy: по умолчанию в кубере «все ходят ко всем». Закручиваем гайки:
#   1. входящий трафик ко всем подам namespace'а запрещён;
#   2. HTTP к приложению (и canary) разрешён отовсюду — NodePort, Gateway, Prometheus;
#   3. к Postgres пускаем только поды с меткой postgres-access=true
#      (приложение и CronJob бэкапа);
#   4. к агентам DaemonSet'а — только само приложение;
#   5. UI Prometheus — отовсюду.
# Исходящий трафик не ограничиваем (приложению нужен Kubernetes API и DNS).
#
#   kubectl apply -f k8s/extras/network-policy.yaml
#   kubectl -n kube-demo run np-test --rm -it --image=postgres:16-alpine -- pg_isready -h postgres -t 3
#     -> no response (без метки)
#   kubectl -n kube-demo run np-test --rm -it --labels=postgres-access=true --image=postgres:16-alpine -- pg_isready -h postgres -t 3
#     -> accepting connections
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kube-demo
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-http
  namespace: kube-demo
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["kube-demo", "kube-demo-canary"]
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-clients
  namespace: kube-demo
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              postgres-access: "true"
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-agent-from-app
  namespace: kube-demo
spec:
  podSelector:
    matchLabels:
      app: node-agent
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["kube-demo", "kube-demo-canary"]
      ports:
        - port: 9100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ui
  namespace: kube-demo
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 9090
