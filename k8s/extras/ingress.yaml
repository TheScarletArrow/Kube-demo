# Ingress для кластеров, где уже есть ingress-контроллер
# (Traefik в k3s/k3d/Rancher Desktop, облачные контроллеры и т.п.).
# ingressClassName не указан -> используется класс по умолчанию;
# при необходимости раскомментируйте и укажите свой.
#   kubectl apply -f k8s/extras/ingress.yaml
#   curl -H 'Host: kube-demo.localhost' http://<адрес-контроллера>/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-demo
  namespace: kube-demo
spec:
  # ingressClassName: traefik
  rules:
    - host: kube-demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-demo
                port:
                  name: http
