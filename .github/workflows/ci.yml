name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:demo@localhost:5432/postgres?sslmode=disable

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s/ | ./kubeconform -strict -summary -kubernetes-version 1.33.0 -
          # extras: HTTPRoute проверяем по схемам CRD из каталога, values для helm — не манифест
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 -ignore-filename-pattern 'values' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/extras/

  e2e:
    name: E2E in kind
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          version: v0.29.0
          config: kind-config.yaml
          cluster_name: kube-demo
      - name: Build, load and deploy
        run: make build load deploy
      - run: kubectl -n kube-demo get pods -o wide
      - name: Smoke test
        run: make smoke
      - name: Zero-downtime rolling update
        run: make zero-downtime
      - name: Cluster control via app + data persistence
        run: make persistence
      - name: NetworkPolicy
        run: make features F=network-policy
      - name: Native sidecar
        run: make features F=sidecar
      - name: DaemonSet
        run: make features F=nodes
      - name: CronJob / Job
        run: make features F=backup
      - name: In-place resize
        run: make features F=resize
      - name: OOMKilled
        run: make features F=oom
      - name: Broken release + rollout undo
        run: make features F=broken-release
      - name: ResourceQuota
        run: make features F=quota
      - name: Metrics + Prometheus
        run: make features F=observability
      - name: Gateway API + canary
        run: make features F=gateway
      - name: Debug info
        if: failure()
        run: |
          kubectl -n kube-demo get all,endpointslices,pvc,networkpolicy,quota -o wide
          kubectl -n kube-demo get events --sort-by=.lastTimestamp | tail -50
          kubectl -n kube-demo logs -l app=kube-demo --all-containers --prefix --tail=100

  publish:
    name: Publish image to GHCR
    # Образ публикуем только из main и тегов v*.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
